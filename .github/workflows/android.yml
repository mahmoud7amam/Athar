name: Build Android (APK + AAB) with native adhan

on:
  push:
    branches: [main, master]
    paths: ['android/**', 'adhan.m4a', 'icon-*.png', '.github/workflows/android.yml']
  workflow_dispatch:

# الأسرار المطلوبة (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64      = محتوى signing.keystore بصيغة base64
#   ANDROID_KEYSTORE_PASSWORD = باسورد الـ keystore
#   ANDROID_KEY_ALIAS         = my-key-alias
#   ANDROID_KEY_PASSWORD      = باسورد المفتاح

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)"
          echo "sdkmanager: $SDKM"
          [ -x "$SDKM" ] || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare assets
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/raw
          cp adhan.m4a $RES/raw/adhan.m4a
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $RES/mipmap-$d
            cp icon-192.png $RES/mipmap-$d/ic_launcher.png
          done

      # إصلاح إيرور: style/Theme.AppCompat.NoActionBar not found
      # الحل: إضافة مكتبة appcompat لو مش موجودة، ولو معرفناش نضيفها نغيّر الثيم لثيم النظام
      - name: Fix AppCompat theme error
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          GRADLE=""
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && GRADLE="$f" && break
          done
          echo "gradle file: $GRADLE"

          if [ -n "$GRADLE" ] && grep -q "androidx.appcompat:appcompat" "$GRADLE"; then
            echo "appcompat already present"
          elif [ -n "$GRADLE" ] && grep -q "dependencies *{" "$GRADLE"; then
            case "$GRADLE" in
              *.kts) LINE='    implementation("androidx.appcompat:appcompat:1.7.0")' ;;
              *)     LINE='    implementation "androidx.appcompat:appcompat:1.7.0"' ;;
            esac
            # نضيف السطر بعد أول dependencies {
            awk -v line="$LINE" '{print} !done && /dependencies *\{/ {print line; done=1}' "$GRADLE" > "$GRADLE.tmp" && mv "$GRADLE.tmp" "$GRADLE"
            echo "appcompat added to $GRADLE"
          else
            echo "could not add appcompat, switching manifest theme"
            sed -i 's#@style/Theme.AppCompat.NoActionBar#@android:style/Theme.Material.NoActionBar#g' "$MANIFEST"
          fi

          echo "---- themes in manifest ----"
          grep -n "Theme" "$MANIFEST" || true
          echo "---- dependencies ----"
          grep -n "implementation\|dependencies" "$GRADLE" || true

      # إصلاح إيرور: Duplicate class kotlin.* (kotlin-stdlib مع stdlib-jdk7 / jdk8)
      # من Kotlin 1.8 فوق الـ jdk7 والـ jdk8 بقوا جوه stdlib نفسها، فبنشيلهم من الـ build
      - name: Fix duplicate Kotlin classes
        run: |
          GRADLE=""
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && GRADLE="$f" && break
          done
          [ -n "$GRADLE" ] || { echo "no app gradle file"; exit 1; }
          if grep -q "kotlin-stdlib-jdk7" "$GRADLE"; then
            echo "exclude already present"
          else
            case "$GRADLE" in
              *.kts)
                printf '\nconfigurations.all {\n    exclude(group = "org.jetbrains.kotlin", module = "kotlin-stdlib-jdk7")\n    exclude(group = "org.jetbrains.kotlin", module = "kotlin-stdlib-jdk8")\n}\n' >> "$GRADLE"
                ;;
              *)
                printf "\nconfigurations.all {\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n}\n" >> "$GRADLE"
                ;;
            esac
            echo "added kotlin excludes to $GRADLE"
          fi
          tail -n 8 "$GRADLE"

      # حل سريع للكراش: ثيم الـ Activities لازم يكون AppCompat (ده آمن حتى لو الـ Activity عادية)
      - name: Fix activity themes
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#@android:style/Theme.DeviceDefault.NoActionBar#@style/Theme.AppCompat.NoActionBar#g' "$MANIFEST"
          echo "---- themes after fix ----"
          grep -n "theme" "$MANIFEST" || true

      # طباعة معلومات للتشخيص (تظهر في لوج الخطوة)
      - name: Print debug info
        run: |
          echo "==== AndroidManifest.xml ===="
          cat android/app/src/main/AndroidManifest.xml
          echo "==== Activities / Services classes ===="
          grep -rn "extends .*Activity\|extends .*Service\|extends .*Receiver" android/app/src/main/java 2>/dev/null || true

      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "ANDROID_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK + AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: athar-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
