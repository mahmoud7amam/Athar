name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Install Dependencies
        run: npm install @capacitor/cli @capacitor/core @capacitor/android
        
      - name: Capacitor Sync
        run: |
          # إنشاء مجلد ويب وهمي ليرضى Capacitor بالعمل
          mkdir -p www
          # التأكد من وجود ملف الإعدادات
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.athar.app","appName":"Athar","webDir":"www","server":{"url":"https://your-site.vercel.app","cleartext":true}}' > capacitor.config.json
          fi
          # الحل الذكي: إذا المجلد موجود اعمل sync، إذا لا اعمل add
          if [ -d "android" ]; then
            echo "Android folder exists, syncing..."
            npx cap sync android
          else
            echo "Android folder missing, adding..."
            npx cap add android
          fi
          
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
