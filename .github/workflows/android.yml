name: Build Athar APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Web to APK
        uses: papaluca/web-to-apk-action@v1
        with:
          # اسم التطبيق
          app_name: "Athar"
          # الرابط بتاعك على Vercel
          website_url: "https://athar-project.vercel.app"
          # أيقونة التطبيق (تأكد إن اسمها icon.png في مشروعك)
          icon_path: "icon-512.png"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: ./*.apk
