name: Build Android APK from PWA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Accept Android licenses ───────────────────────────────────────────
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # ── 6. Install Bubblewrap ────────────────────────────────────────────────
      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # ── 7. توليد Keystore تلقائياً ───────────────────────────────────────────
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/release.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=AtharQurani, OU=App, O=App, L=Cairo, S=Cairo, C=EG"

      # ── 8. إنشاء twa-manifest.json ───────────────────────────────────────────
      - name: Create TWA manifest
        run: |
          mkdir -p twa-project
          cat > twa-project/twa-manifest.json << 'MANIFEST'
          {
            "packageId": "com.atharqurani.app",
            "host": "athar-silk.vercel.app",
            "name": "أثر القرآني",
            "launcherName": "أثر القرآني",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#1a1a2e",
            "navigationColor": "#1a1a2e",
            "navigationColorDark": "#1a1a2e",
            "navigationDividerColor": "#1a1a2e",
            "navigationDividerColorDark": "#1a1a2e",
            "backgroundColor": "#ffffff",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://athar-silk.vercel.app/icons/icon-512x512.png",
            "maskableIconUrl": "https://athar-silk.vercel.app/icons/icon-512x512.png",
            "monochromeIconUrl": "https://athar-silk.vercel.app/icons/icon-512x512.png",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "../release.jks",
              "alias": "release"
            },
            "splashScreenFadeOutDuration": 300,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://athar-silk.vercel.app/",
            "minSdkVersion": 19,
            "targetSdkVersion": 34,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://athar-silk.vercel.app/manifest.json",
            "shortcuts": [],
            "features": {},
            "alphaDependencies": { "enabled": false },
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          MANIFEST

      # ── 9. بناء الـ APK ───────────────────────────────────────────────────────
      # الحل: نكتب config لـ Bubblewrap مسبقاً عشان يعرف مسار JDK
      # وبكده مش هيسأل أي سؤال تفاعلي
      - name: Configure Bubblewrap JDK path
        run: |
          mkdir -p $HOME/.bubblewrap
          cat > $HOME/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          echo "Bubblewrap config:"
          cat $HOME/.bubblewrap/config.json

      - name: Build APK with Bubblewrap
        run: |
          cd twa-project
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath "$RUNNER_TEMP/release.jks" \
            --signingKeyAlias "release" \
            --signingKeyPassword "android123" \
            --signingStorePassword "android123"
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: "true"
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── 10. إيجاد الـ APK ────────────────────────────────────────────────────
      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          echo "Found: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      # ── 11. رفع الـ APK ──────────────────────────────────────────────────────
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: athar-qurani-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
