name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          keytool -genkey -v -keystore my-key.keystore -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Mahmoud, OU=Athar, O=Athar, L=Qena, S=Qena, C=EG"

      - name: Build APK (Safe Method)
        run: |
          # بنعمل init وبناخد البيانات أوتوماتيك
          bubblewrap init --manifest=https://athar-silk.vercel.app/manifest.json --status=v4 --no-interaction
          
          # بنعدل سطر المفتاح في الملف اللي اتعمل عشان يقرأ المفتاح بتاعنا
          sed -i 's/"path": ".*"/"path": ".\/my-key.keystore"/' twa-manifest.json
          sed -i 's/"alias": ".*"/"alias": "my-alias"/' twa-manifest.json
          
          # البناء مع تجاهل الأخطاء البسيطة
          echo -e "123456\n123456\n" | bubblewrap build --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          # هنا بنخليه يرفع أي ملف APK يلاقيه في أي مكان في المشروع
          path: "**/*.apk"
