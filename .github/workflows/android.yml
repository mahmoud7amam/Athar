name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK (Smart Approval)
        run: |
          # بنستخدم أمر بيدي وقت للسيرفر يجاوب بـ Enter و Yes من غير جنون الـ 16 ألف حرف
          echo -e "\n\ny\ny\ny\ny\ny\ny\n" | bubblewrap init --manifest=https://athar-silk.vercel.app/manifest.json --status=v4 --no-interaction || true
          echo -e "y\ny\ny\ny\ny\ny\n" | bubblewrap build --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-Success-APK
          path: ./*.apk
