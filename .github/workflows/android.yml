name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          
          # إنشاء المفتاح
          keytool -genkey -v -keystore my-key.keystore -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Mahmoud, OU=Athar, O=Athar, L=Qena, S=Qena, C=EG"

          # إنشاء ملف المانيفست كامل يدوياً عشان نلغي خطوة الـ init
          cat <<EOF > twa-manifest.json
          {
            "packageId": "com.mahmoud.athar",
            "host": "athar-silk.vercel.app",
            "name": "Athar",
            "launcherName": "Athar",
            "display": "standalone",
            "themeColor": "#D4AF37",
            "navigationColor": "#000000",
            "backgroundColor": "#000000",
            "startUrl": "/",
            "iconUrl": "https://athar-silk.vercel.app/icon-512.png",
            "maskableIconUrl": "https://athar-silk.vercel.app/icon-512.png",
            "appVersion": "1.0.0",
            "signingKey": {
              "path": "./my-key.keystore",
              "alias": "my-alias"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://athar-silk.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false }
          }
          EOF

      - name: Build APK
        # استخدام --skipConfig عشان نضمن إنه ميحاولش يسأل عن الـ SDK
        run: |
          echo -e "123456\n123456\n" | bubblewrap build --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          # البحث عن أي ملف APK في أي مكان (المسار الأشهر هو app/build/outputs/apk/release/)
          path: "**/*.apk"
