name: Build Athar APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Web to APK
        # بنستخدم أكشن مستقر بياخد الرابط ويحوله
        uses: funnyzak/pwa-to-apk-action@v1
        with:
          app_name: "Athar"
          # حطينا اسم صورتك الحقيقي هنا
          icon_path: "icon-512.png" 
          # رابط مشروعك على فيرسل
          web_url: "https://athar-silk.vercel.app/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: ./*.apk
