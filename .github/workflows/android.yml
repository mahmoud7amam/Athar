name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Generate Key
        run: |
          keytool -genkey -v -keystore my-key.keystore -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Mahmoud, OU=Athar, O=Athar, L=Qena, S=Qena, C=EG"

      - name: Build APK (Force Build)
        run: |
          # محاولة الـ init مع تجاهل أي خطأ في الثيم أو الأيقونات
          bubblewrap init --manifest=https://athar-silk.vercel.app/manifest.json --status=v4 --no-interaction || true
          # البدء في البناء مباشرة مع إرسال الباسوورد
          echo -e "123456\n123456\n" | bubblewrap build --skipConfig || echo "Attempting build again..."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: ./*.apk
