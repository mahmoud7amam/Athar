name: Build Android APK from PWA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Accept Android licenses ───────────────────────────────────────────
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # ── 6. Install Bubblewrap ────────────────────────────────────────────────
      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # ── 7. توليد Keystore تلقائياً ───────────────────────────────────────────
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/release.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=AtharQurani, OU=App, O=App, L=Cairo, S=Cairo, C=EG"

      # ── 8. Config Bubblewrap بمسار JDK صريح ─────────────────────────────────
      - name: Configure Bubblewrap
        run: |
          mkdir -p $HOME/.bubblewrap
          cat > $HOME/.bubblewrap/config.json << BWEOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          BWEOF

      # ── 9. bubblewrap init (يولد المشروع + checksum تلقائياً) ────────────────
      - name: Init TWA project with Bubblewrap
        run: |
          bubblewrap init \
            --manifest "https://athar-silk.vercel.app/manifest.json" \
            --directory twa-project \
            --skipPwaValidation
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: "true"

      # ── 10. بناء الـ APK ─────────────────────────────────────────────────────
      - name: Build APK with Bubblewrap
        run: |
          cd twa-project
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath "$RUNNER_TEMP/release.jks" \
            --signingKeyAlias "release" \
            --signingKeyPassword "android123" \
            --signingStorePassword "android123"
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: "true"

      # ── 11. إيجاد الـ APK ────────────────────────────────────────────────────
      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          echo "Found: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      # ── 12. رفع الـ APK ──────────────────────────────────────────────────────
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: athar-qurani-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
