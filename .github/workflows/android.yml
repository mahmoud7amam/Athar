name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Google Bubblewrap
        # بننزل أداة جوجل الرسمية مباشرة من سيرفرات npm
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        # الأوامر دي بتعمل الـ APK بناءً على رابط موقعك والـ manifest
        run: |
          bubblewrap init --manifest=https://athar-silk.vercel.app/manifest.json --status=v4 --no-interaction
          bubblewrap build --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App-Package
          path: ./*.apk
