name: Build Android (APK + AAB) with native adhan

on:
  push:
    branches: [main, master]
    paths: ['android/**', 'adhan.m4a', 'icon-*.png', '.github/workflows/android.yml']
  workflow_dispatch:

# الأسرار المطلوبة (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64      = محتوى signing.keystore بصيغة base64
#   ANDROID_KEYSTORE_PASSWORD = باسورد الـ keystore
#   ANDROID_KEY_ALIAS         = my-key-alias
#   ANDROID_KEY_PASSWORD      = باسورد المفتاح

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)"
          echo "sdkmanager: $SDKM"
          [ -x "$SDKM" ] || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare assets and ensure valid icon
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/raw
          [ -f "adhan.m4a" ] && cp adhan.m4a $RES/raw/adhan.m4a || touch $RES/raw/adhan.m4a
          
          # توليد أيقونة افتراضية صالحة بأبعاد 192x192 لمنع كراش width and height must be > 0
          python3 -c "
          from PIL import Image, ImageDraw
          import os
          if not os.path.exists('icon-192.png'):
              img = Image.new('RGB', (192, 192), color=(33, 150, 243))
              d = ImageDraw.Draw(img)
              d.rectangle([48, 48, 144, 144], fill=(255, 255, 255))
              img.save('icon-192.png')
          " || true

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $RES/mipmap-$d
            if [ -f "icon-192.png" ]; then
              cp icon-192.png $RES/mipmap-$d/ic_launcher.png
            fi
          done

      # إصلاح إيرور: style/Theme.AppCompat.NoActionBar not found
      - name: Fix AppCompat theme error
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          GRADLE=""
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && GRADLE="$f" && break
          done
          [ -n "$GRADLE" ] || GRADLE="android/app/build.gradle"

          if grep -q "androidx.appcompat:appcompat" "$GRADLE"; then
            echo "appcompat already present"
          elif grep -q "dependencies *{" "$GRADLE"; then
            case "$GRADLE" in
              *.kts) LINE='    implementation("androidx.appcompat:appcompat:1.7.0")' ;;
              *)     LINE='    implementation "androidx.appcompat:appcompat:1.7.0"' ;;
            esac
            awk -v line="$LINE" '{print} !done && /dependencies *\{/ {print line; done=1}' "$GRADLE" > "$GRADLE.tmp" && mv "$GRADLE.tmp" "$GRADLE"
            echo "appcompat added"
          else
            sed -i 's#@style/Theme.AppCompat.NoActionBar#@android:style/Theme.Material.NoActionBar#g' "$MANIFEST" || true
          fi

      # إصلاح إيرور: Duplicate class kotlin.* (kotlin-stdlib مع stdlib-jdk7 / jdk8)
      - name: Fix duplicate Kotlin classes
        run: |
          GRADLE=""
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && GRADLE="$f" && break
          done
          [ -n "$GRADLE" ] || { echo "no app gradle file"; exit 1; }
          if ! grep -q "kotlin-stdlib-jdk7" "$GRADLE"; then
            case "$GRADLE" in
              *.kts)
                printf '\nconfigurations.all {\n    exclude(group = "org.jetbrains.kotlin", module = "kotlin-stdlib-jdk7")\n    exclude(group = "org.jetbrains.kotlin", module = "kotlin-stdlib-jdk8")\n}\n' >> "$GRADLE"
                ;;
              *)
                printf "\nconfigurations.all {\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n}\n" >> "$GRADLE"
                ;;
            esac
          fi

      # حل إضافي لثيمات الـ Activities
      - name: Fix activity themes
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#@android:style/Theme.DeviceDefault.NoActionBar#@style/Theme.AppCompat.NoActionBar#g' "$MANIFEST" || true

      # تسجيل أي كراش في ملف جوه Downloads على الموبايل (athar-crash-*.txt)
      - name: Add crash logger
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          DIR=android/app/src/main/java/com/atharqurani/app
          mkdir -p "$DIR"
          cat > "$DIR/CrashApp.java" <<'EOF'
          package com.atharqurani.app;

          import android.app.Application;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.io.PrintWriter;
          import java.io.StringWriter;

          public class CrashApp extends Application {
              @Override
              public void onCreate() {
                  super.onCreate();
                  final Thread.UncaughtExceptionHandler old = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                      @Override
                      public void uncaughtException(Thread t, Throwable e) {
                          try {
                              StringWriter sw = new StringWriter();
                              e.printStackTrace(new PrintWriter(sw));
                              String txt = "Device: " + Build.MANUFACTURER + " " + Build.MODEL
                                  + " | Android " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")"
                                  + "\nThread: " + t.getName() + "\n\n" + sw.toString();
                              save(txt);
                          } catch (Throwable ignored) {
                          }
                          if (old != null) old.uncaughtException(t, e);
                      }
                  });
              }

              private void save(String txt) throws Exception {
                  String name = "athar-crash-" + System.currentTimeMillis() + ".txt";
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.MIME_TYPE, "text/plain");
                      v.put(MediaStore.Downloads.RELATIVE_PATH, "Download");
                      Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (u != null) {
                          OutputStream os = getContentResolver().openOutputStream(u);
                          os.write(txt.getBytes("UTF-8"));
                          os.close();
                      }
                  } else {
                      File f = new File(getExternalFilesDir(null), name);
                      FileOutputStream os = new FileOutputStream(f);
                      os.write(txt.getBytes("UTF-8"));
                      os.close();
                  }
              }
          }
          EOF
          if ! grep -q "CrashApp" "$MANIFEST"; then
            sed -i '0,/<application/s#<application#<application android:name="com.atharqurani.app.CrashApp"#' "$MANIFEST"
          fi

      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "ANDROID_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK + AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: athar-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
