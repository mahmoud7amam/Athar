name: Build Athar APK
on:
  push:
    branches: [ main ] # تأكد إن اسم الفرع عندك main أو master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Android APK
        uses: eliasmendesbr/simple2app-action@v1.0.1
        with:
          # اسم التطبيق اللي هيظهر على الموبايل
          app_name: "Athar"
          # اسم الحزمة (Package Name)
          app_bundle_id: "com.mahmoud.athar"
          # رابط الأيقونة (لو عندك ملف icon.png في المشروع حط اسمه هنا)
          app_icon_path: "icon-512.png"
          # الملف الرئيسي بتاعك
          index_file: "index.html"

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Athar-Release
          path: ./*.apk
