name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Android APK
        # أداة متطورة جداً وسريعة ومخصصة للأندرويد
        uses: pwa-builder/pwa-auth-action@v3
        with:
          # رابط موقعك
          url: "https://athar-silk.vercel.app/"
          # اسم التطبيق بالانجليزي عشان السيستم
          name: "Athar App"
          # دي أهم حتة: بتخلي الأكشن ميسألش عن الـ Keys
          signing-key: "none"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-Ready-APK
          path: ./*.apk
