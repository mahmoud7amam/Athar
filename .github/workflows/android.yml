name: Build Athar APK
on:
  push:
    branches: [ main ] # تأكد لو master غيرها

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build Process
        run: |
          # الأوامر دي بتبني التطبيق يدوياً
          # تأكد إن عندك ملف manifest.json في المشروع
          bubblewrap init --manifest=https://athar-project.vercel.app/manifest.json --status=v4
          bubblewrap build --skipConfig
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: ./*.apk
