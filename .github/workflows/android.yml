name: Build Athar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # تحديث للإصدار 4

      - name: set up JDK 17 # تحديث لـ JDK 17 للأداء الأفضل
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Android APK
        uses: simple-apps/web-to-app-action@v1.1.0 # الأكشن الصحيح والموجود فعلياً
        with:
          app_name: 'أَثَـرٌ'
          web_url: 'https://athar-silk.vercel.app/'
          icon_path: 'icon-512.png'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4 # تحديث للإصدار 4 لحل مشكلة الـ deprecated
        with:
          name: Athar-Release-APK
          path: ./*.apk
