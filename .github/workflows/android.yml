name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Android APK
        # أداة سريعة لتحويل الـ PWA/Web إلى APK
        uses: jason-v-edu/pwa-to-apk-action@v1
        with:
          url: "https://athar-project.vercel.app" # رابط فيرسل بتاعك
          name: "Athar"
          icon: "icon-512.png"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: ./*.apk
