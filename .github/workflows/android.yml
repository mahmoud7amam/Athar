name: Build APK
on: [push] # هيشتغل أول ما ترفع الكود
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Build APK
        run: |
          bubblewrap build --manifest=https://athar-silk.vercel.app/
          # ملحوظة: غير الرابط لرابط مشروعك الحقيقي
