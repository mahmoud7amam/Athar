name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-Configure Bubblewrap
        # هنا بنعلم السيرفر إزاي يجاوب على الأسئلة من غير ما تظهر
        run: |
          mkdir -p ~/.bubblewrap
          # بنكتب ملف الإعدادات يدوي عشان يتخطى سؤال "فين الـ SDK" وسؤال "أنزل الجافا؟"
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"/usr/local/lib/android/sdk\"}" > ~/.bubblewrap/config.json
          
      - name: Build APK
        # هنا بنستخدم أمر الموافقة على الشروط الرسمي من جوجل قبل ما نبدأ
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          bubblewrap init --manifest=https://athar-silk.vercel.app/manifest.json --status=v4 --no-interaction
          bubblewrap build --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: ./*.apk
