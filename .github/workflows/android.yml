name: Build Android APK
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch: # ده هيسمحلك تشغل البناء بضغطة زرار من غير ما تعمل تعديل (Commit)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # لحل التحذير اللي ظهرلك في الصورة

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Install Dependencies
        run: npm install @capacitor/cli @capacitor/core @capacitor/android
        
      - name: Prepare Capacitor Config
        run: |
          # إنشاء مجلد ويب وهمي لضمان عدم حدوث أخطاء
          mkdir -p www
          echo "Athar App" > www/index.html
          
          # إنشاء ملف الإعدادات برابط موقعك (تأكد من تعديل الرابط هنا)
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.athar.app",
            "appName": "Athar",
            "webDir": "www",
            "server": {
              "url": "https://your-site.vercel.app", 
              "cleartext": true
            }
          }
          EOF
          
      - name: Clean and Build Android
        run: |
          # الخطوة السحرية: مسح أي مجلد أندرويد قديم لتجنب خطأ EEXIST
          rm -rf android
          
          # بناء مجلد الأندرويد من الصفر نظيف تماماً
          npx cap add android
          
      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
