name: Build Android (APK + AAB) with native adhan

on:
  push:
    branches: [main, master]
    paths: ['android/**', 'adhan.m4a', 'icon-*.png', '.github/workflows/android.yml']
  workflow_dispatch:

# الأسرار المطلوبة (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64      = محتوى signing.keystore بصيغة base64  (الأمر:  base64 -w0 signing.keystore)
#   ANDROID_KEYSTORE_PASSWORD = باسورد الـ keystore
#   ANDROID_KEY_ALIAS         = my-key-alias
#   ANDROID_KEY_PASSWORD      = باسورد المفتاح
# لازم نفس الـ keystore بتاع نسخة جوجل بلاي الحالية، وإلا Play هيرفض التحديث.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # (حذفنا setup-android: السيرفر فيه Android SDK جاهز، والخطوة دي كانت بتفشل)

      - name: Install SDK platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)"
          echo "sdkmanager: $SDKM"
          [ -x "$SDKM" ] || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare assets
        run: |
          RES=android/app/src/main/res
          cp adhan.m4a $RES/raw/adhan.m4a
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp icon-192.png $RES/mipmap-$d/ic_launcher.png; done

      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "ANDROID_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK + AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: athar-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
