name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap
        # بننزل أداة جوجل الرسمية لتحويل الويب لتطبيقات
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        # هنا بنستخدم رابط فيرسل وصورتك الـ 512 عشان نطلع الـ APK
        run: |
          bubblewrap init --manifest=https://athar-project.vercel.app/manifest.json --status=v4
          bubblewrap build --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: ./*.apk
