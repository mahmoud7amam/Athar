name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK (Force Approval)
        # أمر yes بيخلي السيرفر يوافق على كل الشروط أوتوماتيك
        run: |
          yes | bubblewrap init --manifest=https://athar-silk.vercel.app/manifest.json --status=v4 --no-interaction || true
          yes | bubblewrap build --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-Ready-APK
          path: ./*.apk
