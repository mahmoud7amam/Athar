name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK (Non-Interactive)
        # الكود ده بيجاوب "Yes" على كل أسئلة الأداة أوتوماتيك
        run: |
          yes | bubblewrap init --manifest=https://athar-project.vercel.app/manifest.json
          yes | bubblewrap build --skipConfig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          # هنا بنرفع أي ملف APK ناتج عن العملية
          path: ./*.apk
