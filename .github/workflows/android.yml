name: Build Android APK from PWA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/release.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=AtharQurani, OU=App, O=App, L=Cairo, S=Cairo, C=EG"

      - name: Configure Bubblewrap
        run: |
          mkdir -p $HOME/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" \
            > $HOME/.bubblewrap/config.json
          echo "Config saved:"
          cat $HOME/.bubblewrap/config.json

      # الحل: نعمل المجلد مسبقاً ونبعت "y" لأي سؤال
      - name: Init TWA project with Bubblewrap
        run: |
          mkdir -p twa-project
          printf 'y\n' | bubblewrap init \
            --manifest "https://athar-silk.vercel.app/manifest.json" \
            --directory twa-project \
            --skipPwaValidation
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: "true"

      - name: Build APK with Bubblewrap
        run: |
          cd twa-project
          printf 'n\n' | bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath "$RUNNER_TEMP/release.jks" \
            --signingKeyAlias "release" \
            --signingKeyPassword "android123" \
            --signingStorePassword "android123"
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: "true"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          echo "Found: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: athar-qurani-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
