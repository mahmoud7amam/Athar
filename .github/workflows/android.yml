name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: System Configuration
        # بنعرف الأداة أماكن الأندرويد من غير ما تسأل
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Generate Security Key
        # بنعمل مفتاح أمان للتطبيق (زي اللي بيتعمل لأي تطبيق احترافي) عشان الأداة متطلبهوش
        run: |
          keytool -genkey -v -keystore my-key.keystore -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Mahmoud, OU=Athar, O=Athar, L=Qena, S=Qena, C=EG"

      - name: Bypass Init (Create Manifest)
        # هنا إحنا بنجاوب على كل أسئلة الأداة سلفاً في الملف ده (اسم الموقع، والألوان، والأيقونات)
        run: |
          cat <<EOF > twa-manifest.json
          {
            "packageId": "com.mahmoud.athar",
            "host": "athar-silk.vercel.app",
            "name": "Athar",
            "launcherName": "Athar",
            "display": "standalone",
            "themeColor": "#D4AF37",
            "navigationColor": "#000000",
            "backgroundColor": "#000000",
            "startUrl": "/",
            "iconUrl": "https://athar-silk.vercel.app/icon-512.png",
            "maskableIconUrl": "https://athar-silk.vercel.app/icon-512.png",
            "appVersion": "1.0.0",
            "signingKey": {
              "path": "./my-key.keystore",
              "alias": "my-alias"
            },
            "fallbackType": "customtabs",
            "features": {}
          }
          EOF

      - name: Build APK
        # بندخل على البناء فوراً وبنديله الباسوورد بتاع مفتاح الأمان أوتوماتيك (123456)
        run: |
          echo -e "123456\n123456\n" | bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: ./*.apk
