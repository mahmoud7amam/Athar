name: Athar APK Builder
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK
        uses: omar139506/pwa-to-apk@main
        with:
          # رابط موقعك على فيرسل
          url: "https://athar-silk.vercel.app/"
          # اسم صورتك اللي قلت لي عليه
          icon: "icon-512.png"
          # اسم التطبيق
          name: "Athar"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: ./*.apk
