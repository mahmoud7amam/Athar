name: Build Athar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build APK
        # هنا بنستخدم الرابط بتاعك وبنجاوب على الأسئلة أوتوماتيك بكلمة yes
        run: |
          yes | bubblewrap init --manifest=https://athar-silk.vercel.app/manifest.json --status=v4
          yes | bubblewrap build --skipConfig
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App
          path: ./*.apk
