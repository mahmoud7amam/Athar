name: Apply Athar zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace project with zip contents
        run: |
          set -e
          ZIP=$(ls *.zip | head -1)
          mkdir /tmp/new
          unzip -q "$ZIP" -d /tmp/new
          rm -rf /tmp/new/Athar/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/new/Athar/. .
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Reorganize project into css/js modules"
          git push
