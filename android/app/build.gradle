plugins { id 'com.android.application' }

// التوقيع: متغيّرات بيئة (الـ workflow بيملاها من GitHub Secrets). لو مش موجودة بيطلع APK/AAB غير موقّع.
def ksPath = System.getenv("KEYSTORE_PATH")

android {
    namespace 'com.atharqurani.app'          // حزمة كود جافا + R
    compileSdk 36

    defaultConfig {
        applicationId "app.vercel.athar_silk.twa"   // نفس حزمة تطبيق جوجل بلاي (عشان يتحدّث فوقه)
        minSdk 21
        targetSdk 36
        versionCode 17                              // لازم يكون أكبر من آخر نسخة مرفوعة في Play Console
        versionName "2.5.0"
        // نحتفظ باللغتين العربية والإنجليزية فقط من موارد المكتبات (بتوفّر حجم من غير ما نحذف أي ميزة)
        resConfigs "ar", "en"
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (ksPath) signingConfig signingConfigs.release
            // R8: تصغير الكود وإزالة الكلاسات غير المستخدمة + تقليص الموارد غير المستخدمة
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            crunchPngs true
        }
    }
    // ملفات ميتاداتا زايدة داخل الـ APK (آمنة تماماً)
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/*.version', '/DebugProbesKt.bin']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// منع تكرار كلاسات Kotlin (kotlin-stdlib-jdk7/jdk8 بقوا جوه stdlib من Kotlin 1.8)
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.androidbrowserhelper:locationdelegation:1.1.1'
}
