
plugins {
    id 'com.android.application'
}

// التوقيع: متغيّرات بيئة (الـ workflow بيملاها من GitHub Secrets).
// لو مش موجودة بيطلع APK/AAB غير موقّع.
def ksPath = System.getenv("KEYSTORE_PATH")

android {
    namespace 'com.atharqurani.app'
    compileSdk 36

    defaultConfig {
        applicationId "app.vercel.athar_silk.twa"
        minSdk 21
        targetSdk 36

        // الإصدار الجديد
        versionCode 15
        versionName "2.4.0"
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (ksPath) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// منع تكرار كلاسات Kotlin
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.androidbrowserhelper:locationdelegation:1.1.1'
}
